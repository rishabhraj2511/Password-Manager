services:
  api:
    build:
      context: ./Backend
    container_name: vaultx-api
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
